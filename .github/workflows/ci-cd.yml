# CI/CD: lint → test (Jest + optional Cypress) → Docker build → ECR push → Terraform deploy.
# Configure repository secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
# Optional: repository variable AWS_REGION (defaults to us-east-1).
# Create ECR repositories matching matrix.ecr_repository names (see push job).

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-east-1

jobs:
  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            directory: frontend
          - service: backend
            directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: ESLint / static checks
        working-directory: ${{ matrix.directory }}
        run: npm run lint

  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint
    env:
      CI: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            directory: frontend
            jest_args: --passWithNoTests
          - service: backend
            directory: .
            jest_args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Jest (unit & integration)
        working-directory: ${{ matrix.directory }}
        run: npm test -- --watchAll=false ${{ matrix.jest_args }}

      - name: Cypress (headless)
        if: >-
          matrix.service == 'frontend' &&
          (hashFiles('frontend/cypress.config.ts') != '' ||
           hashFiles('frontend/cypress.config.js') != '' ||
           hashFiles('frontend/cypress.config.mjs') != '')
        working-directory: frontend
        run: npx cypress run --headless

  build:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image_name: job-portal-frontend
          - service: backend
            context: .
            dockerfile: ./backend/Dockerfile
            image_name: job-portal-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: >-
          docker build
          -f ${{ matrix.dockerfile }}
          -t ${{ matrix.image_name }}:${{ env.IMAGE_TAG }}
          ${{ matrix.context }}

      - name: Save image tarball
        run: docker save ${{ matrix.image_name }}:${{ env.IMAGE_TAG }} -o /tmp/${{ matrix.service }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 2

  push:
    name: Push to ECR (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            image_name: job-portal-frontend
            ecr_repository: job-portal-frontend
          - service: backend
            image_name: job-portal-backend
            ecr_repository: job-portal-backend
    env:
      AWS_REGION: ${{ vars.AWS_REGION || env.AWS_REGION }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-${{ matrix.service }}
          path: .

      - name: Load image into Docker
        run: docker load -i ${{ matrix.service }}.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ matrix.ecr_repository }}
          LOCAL_IMAGE: ${{ matrix.image_name }}:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          REMOTE_IMAGE="${REGISTRY}/${REPOSITORY}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_IMAGE}:${IMAGE_TAG}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_IMAGE}:latest"
          docker push "${REMOTE_IMAGE}:${IMAGE_TAG}"
          docker push "${REMOTE_IMAGE}:latest"

  deploy:
    name: Deploy (Terraform)
    runs-on: ubuntu-latest
    needs: push
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    env:
      AWS_REGION: ${{ vars.AWS_REGION || env.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.3

      - name: Terraform apply (staging)
        run: |
          set -euo pipefail
          if [[ -x ./scripts/terraform-apply.sh ]]; then
            echo "Running ./scripts/terraform-apply.sh"
            ./scripts/terraform-apply.sh
          elif [[ -f infrastructure/main.tf ]]; then
            echo "Running terraform apply in infrastructure/"
            terraform -chdir=infrastructure init -input=false
            terraform -chdir=infrastructure apply -input=false -auto-approve
          else
            echo "::notice::Add scripts/terraform-apply.sh or infrastructure/main.tf to enable Terraform deploy."
            exit 0
          fi
